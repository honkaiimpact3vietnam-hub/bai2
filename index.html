<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3.1.3 - Đổi năm dương lịch sang năm âm lịch</title>
</head>
<body>
    <h3>Đổi năm dương lịch sang năm âm lịch</h3>
    <label for="namDuong">Nhập năm dương lịch: </label>
    <input type="number" id="namDuong" placeholder="Ví dụ: 2026">
    <button onclick="tinhNamAmLich()">Xem năm âm lịch</button>
    <p id="ketQua"></p>

    <script>
        function tinhNamAmLich() {
            let nam_duong_lich = parseInt(document.getElementById("namDuong").value);

            if (isNaN(nam_duong_lich) || nam_duong_lich < 0) {
                document.getElementById("ketQua").innerText = "Vui lòng nhập một năm dương lịch hợp lệ!";
                return;
            }

            let duCan = nam_duong_lich % 10;
            let duChi = nam_duong_lich % 12;

            let can = "";
            let chi = "";

            switch (duCan) {
                case 0: can = "Canh"; break;
                case 1: can = "Tân"; break;
                case 2: can = "Nhâm"; break;
                case 3: can = "Quý"; break;
                case 4: can = "Giáp"; break;
                case 5: can = "Ất"; break;
                case 6: can = "Bính"; break;
                case 7: can = "Đinh"; break;
                case 8: can = "Mậu"; break;
                case 9: can = "Kỷ"; break;
            }

            switch (duChi) {
                case 0: chi = "Thân"; break;
                case 1: chi = "Dậu"; break;
                case 2: chi = "Tuất"; break;
                case 3: chi = "Hợi"; break;
                case 4: chi = "Tý"; break;
                case 5: chi = "Sửu"; break;
                case 6: chi = "Dần"; break;
                case 7: chi = "Mẹo"; break;
                case 8: chi = "Thìn"; break;
                case 9: chi = "Tỵ"; break;
                case 10: chi = "Ngọ"; break;
                case 11: chi = "Mùi"; break;
            }

            let nam_am_lich = can + " " + chi;

            document.getElementById("ketQua").innerHTML = 
                "Năm <b>" + nam_duong_lich + "</b> là năm: <b>" + nam_am_lich + "</b>";
        }
    </script>
</body>
</html>
